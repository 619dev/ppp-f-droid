Builds:
  - versionName: 2.6.0
    versionCode: 26000
    commit: 19c4f36195be4dc1dec5e428d2ff2518002bfb83
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    init:
      - cd ../..
      - npm ci --ignore-scripts
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sh scripts/check-fdroid.sh
      - npm run build
      - npx --no-install cap sync android
      - sh scripts/check-fdroid.sh
    scandelete:
      - node_modules

