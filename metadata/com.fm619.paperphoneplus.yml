AutoName: PaperPhonePlus
Summary: End-to-end encrypted messaging and calls
Description: |-
  PaperPhonePlus is a free and open-source communication client with
  end-to-end encrypted private and group messaging, voice and video calls,
  contacts, and moments.

  This build contains no proprietary push SDK and does not require Google
  Play Services. It can connect to a compatible self-hosted server.

