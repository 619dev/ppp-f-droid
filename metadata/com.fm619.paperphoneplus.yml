Builds:
  - versionName: 2.3.8
    versionCode: 23008
    commit: e4c02d2ef9a8112f482161ebdf346ad8823ee191
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    init:
      - cd ../..
      - npm ci --ignore-scripts
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm run build
      - npx --no-install cap sync android
    scandelete:
      - node_modules

